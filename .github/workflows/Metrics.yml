name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/Metrics.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Generate light Metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          user: CodeTrailblazer-Lyra
          filename: metrics-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          output_action: none
          template: classic
          base: header, activity
          config_timezone: Asia/Shanghai
          config_display: regular
          config_padding: "0, 8 + 11%"
          config_twemoji: yes
          extras_css: |
            svg { background: #ffffff !important; color: #24292f !important; }
            h1 { color: #1f2328 !important; }
            h2, h3 { color: #0969da !important; }
            .field svg { fill: #656d76 !important; }
            .field.error { color: #cf222e !important; }
            .field.error svg { fill: #cf222e !important; }
            .field.warning { color: #9a6700 !important; }
            .field.warning svg { fill: #9a6700 !important; }
            .activity .issue { color: #0969da !important; }
            .activity .details, .field.language.details small, footer { color: #656d76 !important; }
            .activity .code, code, span.code { background-color: #afb8c133 !important; color: #24292f !important; }
            :root {
              --color-calendar-graph-day-bg: #ebedf0;
              --color-calendar-graph-day-border: rgba(27,31,35,0.06);
              --color-calendar-graph-day-L1-bg: #9be9a8;
              --color-calendar-graph-day-L2-bg: #40c463;
              --color-calendar-graph-day-L3-bg: #30a14e;
              --color-calendar-graph-day-L4-bg: #216e39;
              --color-calendar-graph-day-L4-border: rgba(27,31,35,0.06);
              --color-calendar-graph-day-L3-border: rgba(27,31,35,0.06);
              --color-calendar-graph-day-L2-border: rgba(27,31,35,0.06);
              --color-calendar-graph-day-L1-border: rgba(27,31,35,0.06);
            }
          extras_js: |
            document.querySelector("h1 span").textContent = "CodeTrailblazer-Lyra";
            const languageCount = document.querySelectorAll(".language.details").length;
            const languageHeading = [...document.querySelectorAll("h2")].find(heading => /^\d+ Languages?$/.test(heading.textContent.trim()));
            if (languageHeading && languageCount) {
              const textNode = [...languageHeading.childNodes].find(node => node.nodeType === Node.TEXT_NODE && /\d+ Languages?/.test(node.textContent));
              if (textNode) textNode.textContent = ` ${languageCount} Languages`;
            }
            const javaMask = document.querySelector("#languages-bar");
            if (javaMask?.nextElementSibling) javaMask.nextElementSibling.setAttribute("fill", "#b07219");
            for (const field of document.querySelectorAll(".language.details > .field")) {
              if (field.textContent.trim() === "Java") field.querySelector("path")?.setAttribute("fill", "#b07219");
            }
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: lines, percentage
          plugin_languages_colors: github
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: >-
            CodeTrailblazer-Lyra/KeyGo@master,
            CodeTrailblazer-Lyra/Keygo_Web_React@master
          repositories_skipped: CodeTrailblazer-Lyra/CodeTrailblazer-Lyra
          commits_authoring: JunyeZhou, 星河, XingHe, CodeTrailblazer-Lyra

      - name: Generate dark Metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          user: CodeTrailblazer-Lyra
          filename: metrics-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          output_action: none
          template: classic
          base: header, activity
          config_timezone: Asia/Shanghai
          config_display: regular
          config_padding: "0, 8 + 11%"
          config_twemoji: yes
          extras_css: |
            svg { background: #0d1117 !important; color: #c9d1d9 !important; }
            h1 { color: #f0f6fc !important; }
            h2, h3 { color: #58a6ff !important; }
            .field svg { fill: #8b949e !important; }
            .field.error { color: #f85149 !important; }
            .field.error svg { fill: #f85149 !important; }
            .field.warning { color: #d29922 !important; }
            .field.warning svg { fill: #d29922 !important; }
            .activity .issue { color: #58a6ff !important; }
            .activity .details, .field.language.details small, footer { color: #8b949e !important; }
            .activity .code, code, span.code { background-color: #21262d !important; color: #c9d1d9 !important; }
            .calendar .day { outline-color: rgba(240,246,252,0.06); }
            .calendar .day[fill="#ebedf0"] { fill: #21262d !important; }
            .calendar .day[fill="#9be9a8"] { fill: #0e4429 !important; }
            .calendar .day[fill="#40c463"] { fill: #006d32 !important; }
            .calendar .day[fill="#30a14e"] { fill: #26a641 !important; }
            .calendar .day[fill="#216e39"] { fill: #39d353 !important; }
            :root {
              --color-calendar-graph-day-bg: #21262d;
              --color-calendar-graph-day-border: #30363d;
              --color-calendar-graph-day-L1-bg: #0e4429;
              --color-calendar-graph-day-L2-bg: #006d32;
              --color-calendar-graph-day-L3-bg: #26a641;
              --color-calendar-graph-day-L4-bg: #39d353;
              --color-calendar-graph-day-L4-border: #30363d;
              --color-calendar-graph-day-L3-border: #30363d;
              --color-calendar-graph-day-L2-border: #30363d;
              --color-calendar-graph-day-L1-border: #30363d;
            }
          extras_js: |
            document.querySelector("h1 span").textContent = "CodeTrailblazer-Lyra";
            const languageCount = document.querySelectorAll(".language.details").length;
            const languageHeading = [...document.querySelectorAll("h2")].find(heading => /^\d+ Languages?$/.test(heading.textContent.trim()));
            if (languageHeading && languageCount) {
              const textNode = [...languageHeading.childNodes].find(node => node.nodeType === Node.TEXT_NODE && /\d+ Languages?/.test(node.textContent));
              if (textNode) textNode.textContent = ` ${languageCount} Languages`;
            }
            const javaMask = document.querySelector("#languages-bar");
            if (javaMask?.nextElementSibling) javaMask.nextElementSibling.setAttribute("fill", "#b07219");
            for (const field of document.querySelectorAll(".language.details > .field")) {
              if (field.textContent.trim() === "Java") field.querySelector("path")?.setAttribute("fill", "#b07219");
            }
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: lines, percentage
          plugin_languages_colors: github
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: >-
            CodeTrailblazer-Lyra/KeyGo@master,
            CodeTrailblazer-Lyra/Keygo_Web_React@master
          repositories_skipped: CodeTrailblazer-Lyra/CodeTrailblazer-Lyra
          commits_authoring: JunyeZhou, 星河, XingHe, CodeTrailblazer-Lyra

      - name: Collect and verify Metrics outputs
        run: |
          sudo mv /metrics_renders/metrics-light.svg .
          sudo mv /metrics_renders/metrics-dark.svg .
          test -s metrics-light.svg
          test -s metrics-dark.svg
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for filename in ("metrics-light.svg", "metrics-dark.svg"):
              data = Path(filename).read_bytes()
              text = " ".join(ET.fromstring(data).itertext())
              assert "Unexpected error" not in text, filename
              assert "CodeTrailblazer-Lyra" in text, filename
              print(f"{filename}: {len(data)} bytes")
          PY

      - name: Commit Metrics
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403
        with:
          commit_message: "chore: update metrics themes [skip ci]"
          file_pattern: metrics-light.svg metrics-dark.svg
