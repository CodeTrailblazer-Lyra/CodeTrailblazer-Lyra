name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/Metrics.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          user: CodeTrailblazer-Lyra
          filename: metrics-debug.json
          token: ${{ secrets.GITHUB_TOKEN }}
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: inspect metrics data [skip ci]"
          template: classic
          config_output: json
          base: header, activity
          config_timezone: Asia/Shanghai
          config_display: regular
          config_padding: "0, 8 + 11%"
          config_twemoji: yes
          extras_css: |
            svg { background: #0d1117 !important; color: #c9d1d9 !important; }
            h1 { color: #f0f6fc !important; }
            h2, h3 { color: #58a6ff !important; }
            .field svg { fill: #8b949e !important; }
            .field.error { color: #f85149 !important; }
            .field.warning { color: #d29922 !important; }
            .activity .issue { color: #58a6ff !important; }
            footer { color: #8b949e !important; }
            :root {
              --color-calendar-graph-day-bg: #21262d;
              --color-calendar-graph-day-border: #30363d;
              --color-calendar-graph-day-L1-bg: #0e4429;
              --color-calendar-graph-day-L2-bg: #006d32;
              --color-calendar-graph-day-L3-bg: #26a641;
              --color-calendar-graph-day-L4-bg: #39d353;
              --color-calendar-graph-day-L4-border: #30363d;
              --color-calendar-graph-day-L3-border: #30363d;
              --color-calendar-graph-day-L2-border: #30363d;
              --color-calendar-graph-day-L1-border: #30363d;
            }
          extras_js: |
            document.querySelector("h1 span").textContent = "CodeTrailblazer-Lyra";
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: lines, percentage
          plugin_languages_colors: github
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: >-
            CodeTrailblazer-Lyra/KeyGo@master,
            CodeTrailblazer-Lyra/Keygo_Web_React@master
          repositories_skipped: CodeTrailblazer-Lyra/CodeTrailblazer-Lyra
          commits_authoring: JunyeZhou, 星河, XingHe, CodeTrailblazer-Lyra
